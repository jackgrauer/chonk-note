[package]
name = "chonk-note"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "chonk-note"
path = "src/main.rs"

[dependencies]
# Core
anyhow = "1.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "fs", "time"] }

# Terminal UI
crossterm = "0.28"
arboard = "3.4"
base64 = "0.22"  # For Kitty graphics protocol
textwrap = "0.16"  # For word wrapping

# Basic utilities
lazy_static = "1.4"
libc = "0.2"

# File-based notes
chrono = "0.4"
dirs = "5.0"

# Rope-based text editing (from Helix)
ropey = "1.6"